seed: 0
run_name: orbit_wars_ppo_transformer
device: auto
save_dir: artifacts/
checkpoint_every: 50
log_every: 1
opponent: heuristic
self_play_update_interval: 20
sync_mode: "moving_average"
tau: 0.04
self_play_deterministic: true
alternate_player_sides: true

env:
  candidate_count: 16
  ship_bucket_count: 8

model:
  hidden_size: 256
  architecture: "coordinated"
  num_heads: 4
  num_layers: 3

ppo:
  rollout_steps: 64
  num_envs: 8
  total_updates: 2000 # Note: For this public Notebook, total_updates is set to 100 to keep runtime short. For full training, increase it to 2000.

  epochs: 4
  minibatch_size: 256
  gamma: 0.99
  lmbda: 0.95
  clip_coef: 0.2
  ent_coef: 1e-3
  vf_coef: 0.5
  lr: 2e-4
  max_grad_norm: 1.0