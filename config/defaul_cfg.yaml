seed: 0
run_name: orbit_wars_ppo
device: auto
save_dir: artifacts/
checkpoint_every: 50
log_every: 1
opponent: self
self_play_update_interval: 50
self_play_deterministic: false
alternate_player_sides: true

env:
  candidate_count: 12
  ship_bucket_count: 8

model:
  hidden_size: 256
  architecture: "transformer"
  num_heads: 4

ppo:
  rollout_steps: 100
  num_envs: 8
  total_updates: 2000 # Note: For this public Notebook, total_updates is set to 100 to keep runtime short. For full training, increase it to 2000.

  epochs: 4
  minibatch_size: 256
  gamma: 0.99
  lmbda: 0.95
  clip_coef: 0.2
  ent_coef: 1e-3
  vf_coef: 0.5
  lr: 0.0003
  max_grad_norm: 2.0